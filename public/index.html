<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14161c">
<title>Leonida Helper – GTA VI Karte</title>
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="MarkerCluster.css">
<style>
:root{
  --bg:#14161c; --bg2:#1b1e26; --bg3:#232733; --line:#2e3342; --txt:#eceef3; --mut:#9aa1b2;
  --pink:#ff4f8b; --tuerkis:#2ad4c9; --orange:#ff9a3c; --gruen:#3ddc84; --gelb:#ffd23f; --rot:#ff5a5a;
  --ocean:#2f90b0;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --nav:64px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
a{color:var(--tuerkis)}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.main{position:relative;flex:1;min-height:0}
/* ------- Navigation ------- */
.nav{order:2;display:flex;background:#0f1116;border-top:1px solid var(--line);padding-bottom:var(--sab);padding-left:var(--sal);padding-right:var(--sar)}
.nav button{flex:1;min-width:0;background:none;border:0;padding:8px 2px 6px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;border-radius:10px;transition:color .15s,background .15s}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--pink)}
.nav button:active{background:var(--bg3)}
.nav .breit{display:none}
@media (min-width:900px) and (min-height:500px){
  .app{flex-direction:row}
  .nav{order:0;flex-direction:column;width:96px;border-top:0;border-right:1px solid var(--line);padding:calc(10px + var(--sat)) 6px calc(10px + var(--sab)) calc(6px + var(--sal));gap:2px;overflow-y:auto}
  .nav button{flex:0 0 auto;padding:9px 4px;font-size:11.5px}
  .nav .breit{display:flex}.nav .schmal{display:none}
  .logo{display:block!important}
}
.logo{display:none;text-align:center;font-weight:800;font-size:11px;letter-spacing:.08em;line-height:1.15;padding:4px 0 12px;color:var(--txt)}
.logo b{display:block;color:var(--pink);font-size:15px}
/* ------- Views ------- */
.view{position:absolute;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view.on{display:block}
.seite{max-width:920px;margin:0 auto;padding:calc(18px + var(--sat)) calc(16px + var(--sar)) 40px calc(16px + var(--sal))}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:17px;margin:26px 0 10px}
.unter{color:var(--mut);margin:0 0 16px}
.karte-box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.warn{border-color:#6b2a2a;background:#2a1719}
.warn b{color:#ff8a8a}
.hinweis{border-color:#5a4a1a;background:#262014}
.zeile{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:8px 13px;min-height:40px;display:inline-flex;align-items:center;gap:7px;font-size:14px}
.chip.on{background:var(--bg3);border-color:var(--pink)}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.b-m{border-color:#2f6b4a;color:#7be2a7}.b-e{border-color:#6b5a22;color:#ffd96b}.b-u{border-color:#7a2f35;color:#ff8f96}
.b-v{border-color:#7a2f35;color:#ff8f96;font-weight:700}.b-neu{border-color:#c2185b;background:#ff4fa3;color:#1a0f16;font-weight:700}.b-k{border-color:#2b5d6b;color:#7fdcf0}
.btn{border:1px solid var(--line);background:var(--bg3);border-radius:12px;padding:10px 16px;min-height:44px;font-weight:600}
.btn.primaer{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.klein{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn:active{filter:brightness(1.2)}
.feld{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;min-height:46px;outline:none}
.feld:focus{border-color:var(--tuerkis)}
textarea.feld{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12.5px;cursor:pointer;user-select:none}
.tab-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fort{height:6px;background:var(--bg3);border-radius:4px;overflow:hidden;flex:1;min-width:60px}
.fort i{display:block;height:100%;background:var(--pink)}
.leer{color:var(--mut);padding:20px 0;text-align:center}
/* Checkbox */
.haken{appearance:none;-webkit-appearance:none;width:28px;height:28px;border:2px solid #4a5163;border-radius:8px;flex:0 0 28px;display:inline-grid;place-content:center;margin:0;background:var(--bg)}
.haken:checked{background:var(--gruen);border-color:var(--gruen)}
.haken:checked::after{content:"";width:12px;height:7px;border:3px solid #0b1a10;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
/* Liste */
.eintrag{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}
.eintrag .txt{flex:1;min-width:0;cursor:pointer}
.eintrag .titel{font-weight:600}
.eintrag .ort{color:var(--mut);font-size:13px}
.eintrag.fertig .titel{color:var(--mut);text-decoration:line-through}
.gruppe-kopf{display:flex;align-items:center;gap:10px;margin:22px 0 6px}
.gruppe-kopf h2{margin:0;font-size:16px;flex:0 0 auto}
.punkt{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
/* ------- Karte ------- */
#karte{position:absolute;inset:0;background:var(--ocean)}
.leaflet-container{background:var(--ocean);font:inherit}
.leaflet-container img.leaflet-tile{mix-blend-mode:normal!important;width:257px!important;height:257px!important}
.leaflet-control-attribution{background:rgba(20,22,28,.75)!important;color:#cfd4df!important;font-size:10.5px}
.leaflet-control-attribution a{color:#8fe9e2}
.leaflet-bar a{background:#1b1e26;color:#eceef3;border-color:#2e3342;width:40px!important;height:40px!important;line-height:40px!important;font-size:20px}
.leaflet-bar a:hover{background:#232733}
.leaflet-touch .leaflet-bar a{width:44px!important;height:44px!important;line-height:44px!important}
.leaflet-bottom.leaflet-right{margin-bottom:0}
.pin{width:30px;height:30px;border-radius:50%;background:var(--c);border:2px solid #0d0f14;box-shadow:0 1px 4px rgba(0,0,0,.55);display:grid;place-content:center;color:#0d0f14;font-weight:800;font-size:13px;line-height:1}
.pin.ungefaehr{outline:2px dashed rgba(255,255,255,.85);outline-offset:2px}
.pin.erledigt{opacity:.42}
.pin.erledigt span{display:none}
.pin.erledigt::after{content:"✓";font-size:16px}
.pin.aktiv{transform:scale(1.25);border-color:#fff}
.gebiet{color:#fff;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;text-shadow:0 0 3px #000,0 0 6px rgba(0,0,0,.8);transform:translate(-50%,-50%);pointer-events:none}
.gebiet.gross{font-size:15px}
.ziel{width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 3px var(--pink),0 0 8px #000}
.oben{position:absolute;z-index:500;top:calc(10px + var(--sat));left:calc(10px + var(--sal));right:calc(10px + var(--sar));display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.oben>*{pointer-events:auto}
.suche-wrap{flex:1;max-width:420px;position:relative}
.suche-wrap .feld{background:rgba(20,22,28,.94);box-shadow:0 2px 10px rgba(0,0,0,.4);padding-left:40px}
.suche-wrap svg{position:absolute;left:12px;top:13px;width:20px;height:20px;color:var(--mut)}
.treffer{position:absolute;top:52px;left:0;right:0;background:#1b1e26;border:1px solid var(--line);border-radius:12px;max-height:55vh;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none}
.treffer.on{display:block}
.treffer button{display:flex;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;gap:10px;align-items:center;min-height:48px}
.treffer button:active{background:var(--bg3)}
.treffer small{color:var(--mut);display:block}
.rund{width:46px;height:46px;border-radius:12px;background:rgba(20,22,28,.94);border:1px solid var(--line);display:grid;place-content:center;box-shadow:0 2px 10px rgba(0,0,0,.4);flex:0 0 46px}
.rund svg{width:22px;height:22px}
.rund.on{border-color:var(--pink);color:var(--pink)}
.filter-panel{position:absolute;z-index:600;top:calc(64px + var(--sat));right:calc(10px + var(--sar));width:min(340px,calc(100% - 20px));max-height:calc(100% - 84px - var(--sat));overflow-y:auto;background:rgba(20,22,28,.97);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none}
.filter-panel.on{display:block}
.filter-panel h3{margin:4px 4px 8px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.f-zeile{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:10px;min-height:44px;cursor:pointer}
.f-zeile:active{background:var(--bg3)}
.f-zeile .name{flex:1}
.f-zeile .zahl{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.f-zeile.aus{opacity:.4}
.schalter{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:#3a4050;position:relative;flex:0 0 44px;margin:0;transition:background .15s}
.schalter::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.schalter:checked{background:var(--tuerkis)}
.schalter:checked::after{left:21px}
.koord{position:absolute;z-index:500;left:calc(10px + var(--sal));bottom:8px;background:rgba(20,22,28,.85);border-radius:8px;padding:4px 8px;font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums;pointer-events:none}
.koord:empty{display:none}
.modus{position:absolute;z-index:550;left:50%;transform:translateX(-50%);top:calc(66px + var(--sat));background:var(--pink);color:#fff;border-radius:999px;padding:8px 16px;font-weight:600;display:none}
.modus.on{display:block}
/* ------- Detail-Blatt ------- */
.blatt-hg{position:fixed;inset:0;z-index:1500;background:rgba(0,0,0,.35);display:none}
.blatt-hg.on{display:block}
.blatt{position:fixed;z-index:1600;left:0;right:0;bottom:0;max-height:72%;overflow-y:auto;background:var(--bg2);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:0 18px calc(20px + var(--sab));box-shadow:0 -10px 30px rgba(0,0,0,.5);display:none;-webkit-overflow-scrolling:touch}
.blatt.on{display:block}
@media (min-width:900px) and (min-height:500px){
  .blatt{left:auto;top:0;width:400px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--line);padding-top:var(--sat)}
  .blatt-hg{background:transparent;pointer-events:none}
}
.blatt-griff{width:40px;height:5px;border-radius:3px;background:#444b5c;margin:8px auto 4px}
.blatt-kopf{display:flex;align-items:flex-start;gap:10px;padding-top:8px}
.blatt-kopf h2{margin:0;font-size:19px;flex:1}
.x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg3);flex:0 0 44px;font-size:20px}
.kat-zeile{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px;margin:2px 0 10px}
.blatt p{margin:10px 0}
.blatt ol{padding-left:20px;margin:10px 0}.blatt li{margin:5px 0}
.codes{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.code{background:#101218;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.code small{display:block;color:var(--mut);font-size:11.5px}
.code b{font-family:ui-monospace,Menlo,monospace;font-size:20px;letter-spacing:.06em;color:var(--gelb)}
.quellen{font-size:13px;color:var(--mut);margin-top:14px}
.aktionen{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.aktionen .btn{flex:1;min-width:140px}
/* ------- Dialog / Toast ------- */
.dlg-hg{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px}
.dlg-hg.on{display:flex}
.dlg{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(440px,100%);max-height:90%;overflow:auto}
.dlg h3{margin:0 0 10px}
.dlg .feld{margin:6px 0}
.toast{position:fixed;z-index:4000;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%);background:#0d0f14;border:1px solid var(--line);border-radius:12px;padding:10px 16px;display:none;max-width:90%}
.toast.on{display:block}
/* Fahndung */
.sterne,.icons{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.kachel{border:1px solid var(--line);background:var(--bg2);border-radius:14px;padding:12px;text-align:left;min-height:64px}
.kachel.on{border-color:var(--rot);background:#2a1719}
.kachel b{display:block}
.kachel small{color:var(--mut)}
.schritte li{margin:8px 0}
/* Cheats */
.dpad{display:inline-flex;gap:3px;flex-wrap:wrap}
.dpad span{display:inline-grid;place-content:center;width:24px;height:24px;border-radius:6px;background:#101218;border:1px solid var(--line);font-size:13px}
.spoiler{filter:blur(6px);cursor:pointer;user-select:none}
.hilfe{font-size:13px;color:var(--mut)}
.mehr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.mehr-grid button{text-align:left;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);min-height:84px}
.mehr-grid b{display:block;font-size:16px}
.mehr-grid small{color:var(--mut)}
/* ------- Sprache ------- */
.sprache{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg2)}
.sprache button{border:0;background:none;color:var(--mut);padding:6px 10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;min-height:34px}
.sprache button.on{background:var(--pink);color:#fff}
.sprache .flagge{font-size:17px;line-height:1}
.logo .sprache{margin-top:10px}.logo .sprache button{padding:4px 7px;font-size:0}.logo .sprache .flagge{font-size:16px}
.kopf-zeile{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* ------- Missionen ------- */
.mission{border-bottom:1px solid var(--line)}
.mission .eintrag{border-bottom:0}
.mission .mkopf{flex:1;min-width:0;cursor:pointer}
.mission .pfeil{color:var(--mut);font-size:13px;width:18px;text-align:center;flex:0 0 auto;cursor:pointer}
.m-detail{padding:2px 0 14px 46px;font-size:14px}
.m-detail dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 8px}
.m-detail dt{color:var(--mut)}.m-detail dd{margin:0}
.m-detail ul{margin:6px 0 0;padding-left:18px}.m-detail li{margin:3px 0}
.badge.b-tipp{background:rgba(61,220,132,.16);color:var(--gruen);border-color:rgba(61,220,132,.4)}
.badge.b-wer{background:var(--bg3)}
.m-werkzeug{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
/* ------- Geld je Kapitel ------- */
.kap-geld{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.kap-geld .karte-box{margin:0}
.kap-geld .kap{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pink)}
.kap-geld .betrag{color:var(--gruen);font-weight:700;margin:4px 0}
.kap-geld .karte-box.aktuell{border-color:var(--pink)}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="nav">
    <div class="logo"><b>LEONIDA</b>HELPER<div id="logo-sprache"></div></div>
  </nav>
  <div class="main">
    <!-- KARTE -->
    <section class="view" id="v-karte">
      <div id="karte"></div>
      <div class="oben">
        <div class="suche-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input class="feld" id="k-suche" type="search" placeholder="Ort, Waffe, Code suchen…" autocomplete="off">
          <div class="treffer" id="k-treffer"></div>
        </div>
        <button class="rund" id="k-plus" title="Eigenen Punkt setzen" aria-label="Eigenen Punkt setzen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="rund" id="k-filter" title="Filter" aria-label="Filter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button>
        <button class="rund" id="k-lang" title="Sprache / Language" aria-label="Sprache / Language" data-noi18n="1" style="font-size:20px"></button>
      </div>
      <div class="modus" id="k-modus">Tippe auf die Karte, um den Punkt zu setzen</div>
      <div class="filter-panel" id="k-panel"></div>
      <div class="koord" id="k-koord"></div>
    </section>
    <section class="view" id="v-fundorte"><div class="seite" id="s-fundorte"></div></section>
    <section class="view" id="v-geld"><div class="seite" id="s-geld"></div></section>
    <section class="view" id="v-fahndung"><div class="seite" id="s-fahndung"></div></section>
    <section class="view" id="v-codes"><div class="seite" id="s-codes"></div></section>
    <section class="view" id="v-cheats"><div class="seite" id="s-cheats"></div></section>
    <section class="view" id="v-trophaeen"><div class="seite" id="s-trophaeen"></div></section>
    <section class="view" id="v-tipps"><div class="seite" id="s-tipps"></div></section>
    <section class="view" id="v-jagd"><div class="seite" id="s-jagd"></div></section>
    <section class="view" id="v-optionen"><div class="seite" id="s-optionen"></div></section>
    <section class="view" id="v-autos"><div class="seite" id="s-autos"></div></section>
    <section class="view" id="v-missionen"><div class="seite" id="s-missionen"></div></section>
    <section class="view" id="v-hundert"><div class="seite" id="s-hundert"></div></section>
    <section class="view" id="v-neu"><div class="seite" id="s-neu"></div></section>
    <section class="view" id="v-mehr"><div class="seite" id="s-mehr"></div></section>
  </div>
</div>

<div class="blatt-hg" id="blatt-hg"></div>
<div class="blatt" id="blatt" role="dialog" aria-modal="false"></div>
<div class="dlg-hg" id="dlg-hg"><div class="dlg" id="dlg"></div></div>
<div class="toast" id="toast"></div>

<script src="leaflet.js"></script>
<script src="leaflet.markercluster.js"></script>
<script src="data.js?v=110"></script>
<script src="gebiete.js?v=110"></script>
<script src="funde.js?v=110"></script>
<script src="community.js?v=110"></script>
<script src="orte.js?v=110"></script>
<script src="positionen.js?v=110"></script>
<script src="data-en.js?v=110"></script>
<script src="i18n.js?v=110"></script>
<script src="i18n-en.js?v=110"></script>
<script src="nachtrag.js?v=110"></script>
<script src="lage.js?v=110"></script>
<script>
"use strict";
/* =========================================================================
   Leonida Helper – Programm. Inhalte stehen in data.js (siehe Kommentar dort).

      (offen && tl.length > 1 ? `<div class="chips" style="margin:0 6px 10px 28px">${tl.map(([t, c]) => `<button class="chip ${S.einst.ausTyp[k.id + "|" + t] ? "" : "on"}" data-t="${esc(k.id + "|" + t)}" style="min-height:34px;padding:5px 10px;font-size:13px">${esc(t)} <span class="hilfe">${c}</span></button>`).join("")}</div>` : "");
  }).join("") +
  `<div class="zeile" style="margin:6px 4px 10px;gap:8px"><button class="btn klein" data-alle="1">Alle an</button><button class="btn klein" data-alle="0">Alle aus</button></div>
   <h3>Anzeige</h3>
   <label class="f-zeile"><span class="name">Nur offene Punkte</span><input type="checkbox" class="schalter" data-e="nurOffen" ${S.einst.nurOffen ? "checked" : ""}></label>
   <label class="f-zeile"><span class="name">Gebietsnamen</span><input type="checkbox" class="schalter" data-e="gebiete" ${S.einst.gebiete ? "checked" : ""}></label>
   <label class="f-zeile"><span class="name">gtadb-Orte (ab Zoom 3)</span><input type="checkbox" class="schalter" data-e="gtadb" ${S.einst.gtadb ? "checked" : ""}></label>
   <p class="hilfe" style="margin:8px 6px">Läden & Dienste erscheinen ab Zoomstufe 3, Banken ab 2 – oder sofort, wenn du eine Stadt wählst. Gestrichelter Ring = Lage ungefähr. Lange drücken auf die Karte zeigt die Koordinaten.</p>`;
  pnl.onchange = e => {
    const t = e.target;
    if (t.id === "f-stadt") { S.einst.stadt = t.value; speichern(); markerAktualisieren(); stadtZeigen(); filterPanelBauen(); return; }
    if (t.dataset.kc) { S.einst.aus[t.dataset.kc] = !t.checked; t.closest(".f-zeile").classList.toggle("aus", !t.checked); }
    if (t.dataset.e) S.einst[t.dataset.e] = t.checked;
    speichern(); markerAktualisieren(); gebieteAktualisieren(); gtadbAktualisieren();
  };
  pnl.onclick = e => {
    const x = e.target.closest("[data-x]"); if (x) { UI_K.offen[x.dataset.x] = !UI_K.offen[x.dataset.x]; filterPanelBauen(); return; }
    const tb = e.target.closest("[data-t]"); if (tb) { const key = tb.dataset.t; if (S.einst.ausTyp[key]) delete S.einst.ausTyp[key]; else S.einst.ausTyp[key] = 1; speichern(); markerAktualisieren(); filterPanelBauen(); return; }
    const b = e.target.closest("[data-alle]"); if (!b) return;
    LH.KATEGORIEN.forEach(k => S.einst.aus[k.id] = b.dataset.alle !== "1"); if (b.dataset.alle === "1") S.einst.ausTyp = {};
    speichern(); markerAktualisieren(); filterPanelBauen();
  };
}
function stadtZeigen() {
  if (!KARTE.map) return;
  if (!S.einst.stadt) { KARTE.map.fitBounds(L.latLngBounds(ll(-8300, -7600), ll(2600, 9200))); return; }
  const pts = alleOrte().filter(o => o.p && o.stadt === S.einst.stadt).map(o => ll(o.p[0], o.p[1]));
  if (pts.length) KARTE.map.fitBounds(L.latLngBounds(pts).pad(0.15), { maxZoom: 5 });
}
function zeigeAufKarte(id) {
  const o = ortById(id); if (!o) return;
  const ziel = o.p ? o : (o.at ? ortById(o.at) : null);
  if (!KARTE.map) { KARTE.offenNach = id; gehe("karte"); return; }

  if (ziel) {

    const m = KARTE.marker[ziel.id]; if (m && m._icon) m._icon.firstChild.classList.add("aktiv");

}
function zielSetzen(x, y) {

}
async function punktMenue(x, y, name) {

    html: `<p class="hilfe">Spielkoordinaten: x ${Math.round(x)} · y ${Math.round(y)}</p><p><a href="${gtadbLink(x, y, 5)}" target="_blank" rel="noopener">Diese Stelle auf map.gtadb.org öffnen</a></p>`,
    ok: "Hier eigenen Punkt setzen", abbrechen: "Schließen" });

}
async function eigenAnlegen(x, y, vorschlag) {

/* Suche */
function sucheEinrichten() {
  const inp = $("#k-suche"), box = $("#k-treffer");
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  inp.addEventListener("input", () => {
    const q = norm(inp.value.trim());
    if (q.length < 2) { box.classList.remove("on"); return; }
    const eigene = alleOrte().filter(o => norm([o.n, o.r, o.t, o.typ, o.stadt, (o.waffen || []).join(" "), (o.codes || []).map(c => c.join(" ")).join(" ")].join(" ")).includes(q)).slice(0, 25);
    const geb = LH.GEBIETE.filter(g => norm(g[0]).includes(q)).slice(0, 5);
    const gt = window.GTADB_ORTE.filter(g => norm(g[0]).includes(q)).slice(0, 15);
    let h = eigene.map(o => `<button data-o="${o.id}"><span class="punkt" style="background:${(KAT[o.k] || KAT.eigen).farbe}"></span><span>${esc(o.n)}<small>${esc([o.typ, o.stadt || o.r].filter(Boolean).join(" · ") || KAT[o.k]?.name || "")}${o.p || o.at ? "" : " · nicht auf der Karte"}</small></span></button>`).join("");
    h += geb.map(g => `<button data-x="${g[1]}" data-y="${g[2]}" data-z="${Math.max(3, g[3] + 1.5)}"><span class="punkt" style="background:#fff"></span><span>${esc(g[0])}<small>Gebiet</small></span></button>`).join("");
    h += gt.map(g => `<button data-x="${g[1]}" data-y="${g[2]}" data-z="5.5" data-n="${esc(g[0])}"><span class="punkt" style="background:#ddd;border:2px solid #333"></span><span>${esc(g[0])}<small>gtadb-Ort</small></span></button>`).join("");
    box.innerHTML = h || `<div class="leer">Nichts gefunden</div>`;
    box.classList.add("on");
  });
  inp.addEventListener("keydown", e => { if (e.key === "Escape") { inp.value = ""; box.classList.remove("on"); } });
  box.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    box.classList.remove("on"); inp.blur();
    if (b.dataset.o) return zeigeAufKarte(b.dataset.o);
    const x = +b.dataset.x, y = +b.dataset.y;
    KARTE.map.setView(ll(x, y), +b.dataset.z); zielSetzen(x, y);
    if (b.dataset.n) toast(b.dataset.n);
  });
}

/* ================================================================= DETAIL */

    <div class="kat-zeile"><span class="punkt" style="background:${k.farbe}"></span>${esc(k.name)}${o.typ && o.typ !== (LH.TYP_STANDARD || {})[o.k] ? " · " + esc(o.typ) : ""}${o.r ? " · " + esc(o.r) : ""}${o.stadt && !(o.r || "").includes(o.stadt) ? " · " + esc(o.stadt) : ""}</div>
    <div class="zeile" style="gap:6px">${badges(o)}</div>
    ${o.t ? `<p>${esc(o.t)}</p>` : ""}
    ${o.s ? `<ol>${o.s.map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : ""}
    ${o.waffen ? `<p><b>Einzigartige Waffe hier:</b> ${o.waffen.map(esc).join(", ")}</p>` : ""}
    ${o.codes ? `<div class="codes">${o.codes.map(([l, c]) => `<div class="code"><small>${esc(l)}</small><b>${esc(c)}</b></div>`).join("")}</div>` : ""}
    <div class="aktionen">
      <button class="btn ${fertig ? "" : "primaer"}" data-a="done">${fertig ? "✓ Erledigt – zurücksetzen" : "Als erledigt markieren"}</button>
      ${ziel && location.hash !== "#karte" ? `<button class="btn" data-a="karte">Auf der Karte zeigen</button>` : ""}
      ${ziel ? `<a class="btn" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;color:inherit" href="${gtadbLink(ziel.p[0], ziel.p[1], 5)}" target="_blank" rel="noopener">Auf map.gtadb.org</a>` : ""}
      ${o.eigen ? `<button class="btn" data-a="del">Punkt löschen</button>` : ""}
    </div>
    ${ziel ? `<p class="hilfe">Koordinaten: x ${ziel.p[0]} · y ${ziel.p[1]}</p>` : ""}
    ${quellenHtml(o.src)}`;
  b.classList.add("on"); $("#blatt-hg").classList.add("on"); b.scrollTop = 0;
}
function detailZu() { $("#blatt").classList.remove("on"); $("#blatt-hg").classList.remove("on"); detailId = null; if (KARTE.fokus) { KARTE.fokus = null; markerAktualisieren(); } $$(".pin.aktiv").forEach(p => p.classList.remove("aktiv")); }
$("#blatt-hg").onclick = detailZu;
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && detailId) detailZu();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); gehe("karte"); setTimeout(() => $("#k-suche").focus(), 80); }
});
$("#blatt").onclick = async e => {
  const a = e.target.closest("[data-a]"); if (!a) return;
  const o = ortById(detailId);
  if (a.dataset.a === "zu") detailZu();
  if (a.dataset.a === "done") { setDone("o:" + o.id, !istDone("o:" + o.id)); allesNeu(); detail(o.id); }
  if (a.dataset.a === "karte") { const id = o.id; detailZu(); zeigeAufKarte(id); }

    if (await dialog({ titel: "Punkt löschen?", html: `<p>„${esc(o.n)}“ wird aus diesem Spielstand entfernt.</p>`, ok: "Löschen", gefahr: true })) {
      P().eigen = P().eigen.filter(x => x.id !== o.id); speichern();
      if (KARTE.marker[o.id]) { KARTE.map.removeLayer(KARTE.marker[o.id]); delete KARTE.marker[o.id]; }

};
function allesNeu() {
  markerAktualisieren();
  if ($("#k-panel").classList.contains("on")) filterPanelBauen();
  const v = location.hash.slice(1); if (v && v !== "karte" && RENDER[v]) RENDER[v]();
}

/* ================================================================= SEITEN */
const RENDER = {};
const UI = { fKat: null, fOffen: false, fSuche: "", cKat: "Alle", cNurCode: false, cSuche: "", tFilter: "alle", codeSuche: "", geldSort: "kap" };

/* ---- Fundorte ---- */
RENDER.fundorte = () => {
  const el = $("#s-fundorte");
  UI.fAuf = UI.fAuf || {};
  const orte = alleOrte();
  const gesamtD = orte.filter(o => istDone("o:" + o.id)).length;
  const q = UI.fSuche.toLowerCase();

    (!q || [o.n, o.r, o.t, o.typ, o.stadt, (o.waffen || []).join(" ")].join(" ").toLowerCase().includes(q));
  const typen = UI.fKat ? [...new Set(orte.filter(o => o.k === UI.fKat && (!UI.fStadt || o.stadt === UI.fStadt)).map(o => o.typ))].sort() : [];
  const zeile = o => `<div class="eintrag ${istDone("o:" + o.id) ? "fertig" : ""}"><input type="checkbox" class="haken" data-d="${o.id}" ${istDone("o:" + o.id) ? "checked" : ""} aria-label="erledigt">
      <div class="txt" data-o="${o.id}"><div class="titel">${esc(o.n)}</div><div class="ort">${esc([o.stadt && !(o.r || "").includes(o.stadt) ? o.stadt : "", o.r || ""].filter(Boolean).join(" · "))}</div><div class="zeile" style="gap:5px;margin-top:4px">${o.v ? '<span class="badge b-v">Verpassbar</span>' : ""}${o.c ? `<span class="badge b-k">Kap. ${esc(o.c)}</span>` : ""}${o.q === "u" ? '<span class="badge b-u">Quellen uneins</span>' : ""}${!o.p && !o.at && o.k !== "eigen" ? '<span class="badge">ohne Kartenpunkt</span>' : ""}</div></div>
      ${o.p || o.at ? `<button class="btn klein" data-k="${o.id}">Karte</button>` : ""}</div>`;
  let h = `<h1>Fundorte</h1><p class="unter">${gesamtD} von ${orte.length} erledigt · Spielstand „${esc(P().name)}“</p>
    <div class="zeile" style="gap:10px"><input class="feld" id="f-suche" type="search" placeholder="Name, Typ, Waffe suchen…" value="${esc(UI.fSuche)}" style="flex:2;min-width:200px">
    <select class="feld" id="f-stadt-l" aria-label="Stadt oder Gebiet" style="flex:1;min-width:170px"><option value="">Alle Städte & Gebiete</option>${LH.STAEDTE.map(st => `<option ${UI.fStadt === st ? "selected" : ""}>${esc(st)}</option>`).join("")}</select></div>
    <div class="chips"><button class="chip ${!UI.fKat ? "on" : ""}" data-fk="">Alle</button>${LH.KATEGORIEN.filter(k => orte.some(o => o.k === k.id)).map(k => `<button class="chip ${UI.fKat === k.id ? "on" : ""}" data-fk="${k.id}"><i style="background:${k.farbe}"></i>${esc(k.name)}</button>`).join("")}
    <button class="chip ${UI.fOffen ? "on" : ""}" data-fo="1">Nur offene</button></div>
    ${typen.length > 1 ? `<div class="chips" style="margin-top:-2px"><button class="chip ${!UI.fTyp ? "on" : ""}" data-ft="" style="min-height:34px;font-size:13px">Alle Typen</button>${typen.map(t => `<button class="chip ${UI.fTyp === t ? "on" : ""}" data-ft="${esc(t)}" style="min-height:34px;font-size:13px">${esc(t)}</button>`).join("")}</div>` : ""}`;
  const fokussiert = !!(UI.fKat || q || UI.fStadt);
  LH.KATEGORIEN.forEach(k => {
    const liste = orte.filter(o => o.k === k.id && (!UI.fStadt || o.stadt === UI.fStadt)); if (!liste.length) return;
    const sicht = liste.filter(passt); if (!sicht.length) return;

    h += `<div class="gruppe-kopf" data-auf="${k.id}" style="cursor:pointer"><span class="punkt" style="background:${k.farbe}"></span><h2>${auf ? "▾" : "▸"} ${esc(k.name)} <span class="hilfe">(${sicht.length})</span></h2><div class="fort"><i style="width:${Math.round(d / liste.length * 100)}%"></i></div><span class="hilfe">${d}/${liste.length}</span></div>`;
    if (!auf) return;
    const gruppen = {}; sicht.forEach(o => (gruppen[o.typ] = gruppen[o.typ] || []).push(o));

    keys.forEach(t => {

    else if (t.dataset.ft !== undefined) { UI.fTyp = t.dataset.ft || null; RENDER.fundorte(); }
    else if (t.closest("[data-fo]")) { UI.fOffen = !UI.fOffen; RENDER.fundorte(); }
    else if (t.dataset.k) zeigeAufKarte(t.dataset.k);

};

  <p class="hilfe">Dein Kapitel stellst du unter Missionen ein.</p>
  <h2>Regeln</h2>
  ${LH.GELD_REGELN.map((r, i) => `<div class="karte-box ${i === 0 ? "warn" : ""}"><b>${esc(r.titel)}</b> <span class="badge b-${r.q}">${QTXT[r.q]}</span><div>${esc(r.text)}</div>${quellenHtml(r.src)}</div>`).join("")}

  ${sortiert.map(m => `<tr><td>${m.kap}</td><td>${esc(m.n)}</td><td>${esc(m.w)}</td><td>${esc(m.risiko)}</td><td>${m.at ? `<button class="btn klein" data-k="${m.at}">Ort</button>` : ""}</td></tr>`).join("")}

    if (fehlt <= 0) { box.innerHTML = `<b style="color:var(--gruen)">Ziel schon erreicht.</b>`; return; }
    const m = LH.GELD.filter(x => x.kap <= kap).sort((a, b) => b.e - a.e);
    box.innerHTML = `<b>Es fehlen ${fehlt.toLocaleString(LOC)} $</b>` + (m.length ? `<table style="margin-top:8px"><tbody>${m.map(x => `<tr><td>${esc(x.n)}</td><td style="white-space:nowrap">ca. ${Math.ceil(fehlt / x.e).toLocaleString(LOC)} × ${esc(x.einheit)}</td></tr>`).join("")}</tbody></table>` : "");
  };
  ["g-ist", "g-ziel", "g-kap"].forEach(id => $("#" + id).addEventListener("input", rechne));
  rechne();
  el.onclick = e => {
    const th = e.target.closest("th[data-s]"); if (th) { UI.geldSort = th.dataset.s; RENDER.geld(); return; }
    if (e.target.dataset.k) zeigeAufKarte(e.target.dataset.k);
  };
};

/* ---- Fahndung ---- */

  const schritte = [];
  if (UI.stern === "hohl") schritte.push("Sofort die Gegend verlassen, bevor die Polizei eintrifft.");

  if (UI.stern === "blink") schritte.push("Nicht auffallen, in Deckung bleiben und den roten Suchbereich verlassen.");
  if (UI.stern === "rot") schritte.push("Gegend meiden – mit passender Beschreibung startet die Jagd neu.");
  aktiv.forEach(h => schritte.push(`<b>${esc(h.n)}:</b> ${esc(h.fix)}`));
  if (UI.stern || aktiv.length) schritte.push("Danach sind alle Hinweise weg – erst dann zurück an den Tatort.");
  el.innerHTML = `<h1>Ich werde gesucht</h1><p class="unter">Tippe an, was du im Spiel siehst. Die App sagt dir die Reihenfolge.</p>

    <div class="icons">${LH.HEAT.map(h => `<button class="kachel ${UI.heat[h.id] ? "on" : ""}" data-h="${h.id}"><b>${esc(h.n)}</b><small>${esc(h.bed)}</small></button>`).join("")}</div>
    <h2>Das tust du jetzt</h2>
    <div class="karte-box">${schritte.length ? `<ol class="schritte">${schritte.map(s => `<li>${s}</li>`).join("")}</ol>` : `<div class="hilfe">Noch nichts ausgewählt.</div>`}
    <button class="btn klein" data-reset="1" style="margin-top:6px">Zurücksetzen</button></div>

/* ---- Missionen ---- */
function missionTipp(m) { return (LH.MISSION_TIPPS || {})[m.n] || null; }
RENDER.missionen = () => {
  const el = $("#s-missionen");
  UI.mAuf = UI.mAuf || {}; UI.mDet = UI.mDet || {}; UI.mOffen = UI.mOffen ?? null;
  const kapAkt = +S.einst.kapitel || 1;
  const alle = LH.MISSIONEN, d = alle.filter(m => istDone("m:" + m.id)).length;
  const q = (UI.mSuche || "").trim().toLowerCase();
  const passt = m => (!UI.mNurTipps || missionTipp(m)) && (!UI.mNurOffen || !istDone("m:" + m.id)) &&
    (!q || [m.n, m.alt].join(" ").toLowerCase().includes(q));
  const naechste = alle.find(m => !m.opt && !istDone("m:" + m.id));
  const mitTipps = alle.filter(missionTipp).length;
  let h = `<div class="kopf-zeile"><div><h1>Missionen</h1><p class="unter">${d} von ${alle.length} erledigt · ${mitTipps} mit Tricks</p></div></div>
    <div class="karte-box hinweis">${esc(TX(LH.MISSIONEN_INFO))}${quellenHtml(["gmm", "pp"])}</div>
    <div class="karte-box"><label class="zeile" style="gap:10px"><span style="flex:1"><b>Ich bin in</b><div class="hilfe">Missionen späterer Kapitel bleiben unscharf (Spoiler-Schutz). Antippen deckt einzeln auf.</div></span>
      <select class="feld" id="m-kap" style="width:auto;min-width:170px">${[1, 2, 3, 4, 5, 6].map(k => `<option value="${k}" ${kapAkt === k ? "selected" : ""}>${k === 6 ? "Story beendet" : "Kapitel " + k}</option>`).join("")}</select></label></div>`;
  if (naechste && !q) {
    const verdeckt = !S.einst.spoiler && naechste.kap > kapAkt;
    h += `<div class="karte-box" style="border-color:var(--pink)"><div class="hilfe">Nächste Pflichtmission</div>
      <div class="zeile" style="gap:10px;margin-top:4px"><b class="${verdeckt ? "spoiler" : ""}" style="flex:1">${esc(naechste.n)}${naechste.alt ? ` <span class="hilfe">(${esc(naechste.alt)})</span>` : ""}</b>
      <span class="badge">${esc(TX(LH.KAPITEL_NAMEN)[naechste.kap] || "")}</span><button class="btn klein" data-zu="${naechste.id}">Anzeigen</button></div></div>`;
  }
  h += `<div class="m-werkzeug"><input class="feld" id="m-suche" type="search" placeholder="Mission suchen…" value="${esc(UI.mSuche || "")}" style="flex:1;min-width:180px">
    <button class="chip ${UI.mNurTipps ? "on" : ""}" data-mf="tipps">Nur mit Tricks</button><button class="chip ${UI.mNurOffen ? "on" : ""}" data-mf="offen">Nur offene</button>
    <button class="chip" data-mf="alle">Alle aufklappen</button></div>`;
  const kapName = TX(LH.KAPITEL_NAMEN);
  [0, 1, 2, 3, 4, 5].forEach(k => {
    const ms = alle.filter(m => m.kap === k), md = ms.filter(m => istDone("m:" + m.id)).length;
    const sicht = ms.filter(passt);
    if (!sicht.length) return;
    const offen = q || UI.mNurTipps ? true : UI.mOffen === null ? (k === Math.min(kapAkt, 5) || (k === 0 && kapAkt === 1)) : UI.mOffen === k || UI.mOffen === "alle";
    h += `<div class="gruppe-kopf" data-mk="${k}" style="cursor:pointer"><h2>${offen ? "▾" : "▸"} ${esc(kapName[k])}</h2><div class="fort"><i style="width:${Math.round(md / ms.length * 100)}%"></i></div><span class="hilfe">${md}/${ms.length}</span></div>`;
    if (!offen) return;
    h += sicht.map(m => {
      const verdeckt = !S.einst.spoiler && k > kapAkt && !UI.mAuf[m.id];
      const tp = missionTipp(m), fertig = istDone("m:" + m.id), auf = UI.mDet[m.id] && !verdeckt;
      const wer = m.wer === "J" ? "Jason" : m.wer === "L" ? "Lucia" : "";
      let det = "";
      if (auf) {
        const zeilen = [];
        if (m.alt) zeilen.push(["Kartenmarker", esc(m.alt)]);
        if (wer) zeilen.push(["Figur", "nur " + wer]);
        if (tp && tp.start) zeilen.push(["Start", esc(TX(tp.start))]);
        if (tp && tp.lohn) zeilen.push(["Belohnung", esc(TX(tp.lohn))]);
        if (tp && tp.codes) zeilen.push(["Codes", tp.codes.map(c => `${esc(c[0])} <code>${esc(c[1])}</code>`).join(" · ")]);
        if (m.opt) zeilen.push(["Art", "optional"]);
        const tipps = tp ? (tp[LANG] || tp.de || []) : [];
        det = `<div class="m-detail">${zeilen.length ? `<dl>${zeilen.map(z => `<dt>${z[0]}</dt><dd>${z[1]}</dd>`).join("")}</dl>` : ""}
          ${tipps.length ? `<b>Tricks</b><ul>${tipps.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : `<div class="hilfe">Keine besonderen Tricks bekannt – einfach der Story folgen.</div>`}
          ${tp ? quellenHtml(LH.MISSION_QUELLEN) : ""}</div>`;
      }
      return `<div class="mission"><div class="eintrag ${fertig ? "fertig" : ""}"><input type="checkbox" class="haken" data-m="${m.id}" ${fertig ? "checked" : ""} aria-label="erledigt">
        <div class="txt mkopf ${verdeckt ? "spoiler" : ""}" data-md="${m.id}" data-sp="${verdeckt ? m.id : ""}"><div class="titel">${esc(m.n)}</div>${m.alt ? `<div class="ort">${esc(m.alt)}</div>` : ""}</div>
        ${wer ? `<span class="badge b-wer">${wer}</span>` : ""}${m.opt ? '<span class="badge">optional</span>' : ""}${tp ? '<span class="badge b-tipp">Tipp</span>' : ""}${tp && tp.v ? '<span class="badge b-v">!</span>' : ""}
        <span class="pfeil" data-md="${m.id}">${verdeckt ? "" : auf ? "▾" : "▸"}</span></div>${det}</div>`;
    }).join("");
  });
  h += `<h2>Strangers & Freaks</h2><div class="karte-box">${esc(LH.STRANGERS_INFO)}</div>
    <div class="tab-scroll"><table><thead><tr><th>Kap.</th><th>Person</th><th>Missionen</th><th>Belohnung</th></tr></thead><tbody>
    ${LH.STRANGERS.map(r => `<tr><td>${r[0]}</td><td><b>${esc(r[1])}</b>${r[4] ? `<div class="hilfe">${esc(r[4])}</div>` : ""}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join("")}
    </tbody></table></div>${quellenHtml(["gmsf"])}`;
  el.innerHTML = h;
  $("#m-kap").onchange = e => { S.einst.kapitel = +e.target.value; speichern(); UI.mOffen = null; RENDER.missionen(); };
  const ms = $("#m-suche"); ms.oninput = () => { UI.mSuche = ms.value; const p = ms.selectionStart; RENDER.missionen(); const n = $("#m-suche"); n.focus(); try { n.setSelectionRange(p, p); } catch (e) {} };
  el.onclick = e => {
    const t = e.target;
    if (t.matches("input")) return;
    const kk = t.closest("[data-mk]"); if (kk) { const k = +kk.dataset.mk; const war = kk.textContent.trim().startsWith("▾"); UI.mOffen = war ? -1 : k; RENDER.missionen(); return; }
    const mf = t.closest("[data-mf]");
    if (mf) { const f = mf.dataset.mf; if (f === "tipps") UI.mNurTipps = !UI.mNurTipps; else if (f === "offen") UI.mNurOffen = !UI.mNurOffen; else { UI.mOffen = "alle"; LH.MISSIONEN.forEach(m => { if (missionTipp(m)) UI.mDet[m.id] = 1; }); } RENDER.missionen(); return; }
    const zu = t.closest("[data-zu]"); if (zu) { const m = LH.MISSIONEN.find(x => x.id === zu.dataset.zu); UI.mOffen = m.kap; UI.mAuf[m.id] = 1; UI.mDet[m.id] = 1; RENDER.missionen(); setTimeout(() => { const z = $(`[data-md="${m.id}"]`); if (z) z.scrollIntoView({ block: "center" }); }, 30); return; }
    const sp = t.closest("[data-sp]"); if (sp && sp.dataset.sp) { UI.mAuf[sp.dataset.sp] = 1; RENDER.missionen(); return; }
    const md = t.closest("[data-md]"); if (md) { const id = md.dataset.md; UI.mDet[id] = !UI.mDet[id]; RENDER.missionen(); }
  };
  el.onchange = e => { if (e.target.dataset.m) { setDone("m:" + e.target.dataset.m, e.target.checked); RENDER.missionen(); } };
};

/* ---- 100 % ---- */
RENDER.hundert = () => {
  const el = $("#s-hundert");
  const z = P().zahlen = P().zahlen || {};
  const wert = r => Math.min(+z[r[0]] || 0, r[3]);
  const fertig = LH.HUNDERT.filter(r => (+z[r[0]] || 0) >= r[3]).length;
  const gruppen = [...new Set(LH.HUNDERT.map(r => r[2]))];
  el.innerHTML = `<h1>100 % Checkliste</h1><p class="unter">${fertig} von ${LH.HUNDERT.length} Punkten erfüllt · Spielstand „${esc(P().name)}“</p>
    <div class="karte-box hinweis">${esc(LH.HUNDERT_INFO)}${quellenHtml(["gm100"])}</div>
    ${gruppen.map(g => `<h2>${esc(g)}</h2>` + LH.HUNDERT.filter(r => r[2] === g).map(r => {
      const geld = r[5] === "$", ok = (+z[r[0]] || 0) >= r[3];
      return `<div class="eintrag ${ok ? "fertig" : ""}"><div class="txt"><div class="titel">${esc(r[1])}</div>
        <div class="ort">nötig ${geld ? r[3].toLocaleString(LOC) + " $" : r[3] + (r[4] && r[4] !== r[3] ? " von " + r[4] : "")}${r[5] && !geld ? " · " + esc(r[5]) : ""}</div>
        <div class="fort" style="margin-top:6px;max-width:260px"><i style="width:${Math.round(wert(r) / r[3] * 100)}%;${ok ? "background:var(--gruen)" : ""}"></i></div></div>
        <div class="zeile" style="gap:6px;flex-wrap:nowrap">${geld ? "" : `<button class="btn klein" data-dz="${r[0]}" data-d="-1" aria-label="weniger">−</button>`}
        <input class="feld" data-z="${r[0]}" aria-label="${esc(r[1])}" inputmode="numeric" value="${+z[r[0]] || 0}" style="width:${geld ? 110 : 64}px;min-height:36px;padding:6px 8px;text-align:center">
        ${geld ? "" : `<button class="btn klein" data-dz="${r[0]}" data-d="1" aria-label="mehr">+</button>`}</div></div>`;
    }).join("")).join("")}`;
  el.onclick = e => { const b = e.target.closest("[data-dz]"); if (!b) return; const id = b.dataset.dz; z[id] = Math.max(0, (+z[id] || 0) + +b.dataset.d); speichern(); RENDER.hundert(); };
  el.onchange = e => { if (e.target.dataset.z) { z[e.target.dataset.z] = Math.max(0, +String(e.target.value).replace(/\D/g, "") || 0); speichern(); RENDER.hundert(); } };
};

/* ---- Neu & Patches ---- */
RENDER.neu = () => {
  const el = $("#s-neu");
  const ids = LH.NEU_IDS || {};
  const neueOrte = Object.keys(ids).map(ortById).filter(Boolean).sort((a, b) => String(ids[b.id]).localeCompare(String(ids[a.id])) || a.n.localeCompare(b.n));
  const datum = d => { const t = Date.parse(d); return isNaN(t) ? esc(d || "") : new Date(t).toLocaleDateString(LOC); };
  const patches = LH.PATCHES || [];
  el.innerHTML = `<h1>Neu & Patches</h1><p class="unter">Datenstand ${esc(LH.STAND)}. Die Hilfe wird täglich mit neuen Funden, Tipps und Patch-Infos ergänzt.</p>
    <h2>Patches & Updates</h2>
    ${patches.length ? patches.map(p => `<div class="karte-box"><b>${esc(/^\d/.test(p.version || "") ? "Version " + p.version : (p.version || "Update").replace(/^[–-]\s*/, ""))}</b> ${neuBadge(p.neu)}<span class="badge">${datum(p.datum)}</span>${p.plattform ? ` <span class="badge">${esc(p.plattform)}</span>` : ""}<div style="margin-top:6px">${esc(p.inhalt)}</div>${quellenHtml(p.src)}</div>`).join("")
      : `<div class="karte-box hilfe">Noch keine Patch-Infos erfasst.</div>`}
    <h2>Änderungsprotokoll</h2>
    ${(LH.NEU_LOG || []).length ? `<div class="karte-box">${LH.NEU_LOG.map(l => `<div class="eintrag"><div class="txt"><div class="titel">${datum(l.datum)} · v${esc(l.version)}</div><div class="ort">${l.punkte.map(esc).join(" · ")}</div></div></div>`).join("")}</div>` : `<div class="karte-box hilfe">Noch keine Nachträge.</div>`}
    <h2>Neue und ergänzte Einträge (${neueOrte.length})</h2>
    <div class="karte-box">${neueOrte.length ? neueOrte.map(o => `<div class="eintrag"><div class="txt" data-o="${o.id}"><div class="titel">${neuBadge(ids[o.id])}${esc(o.n)}</div><div class="ort">${esc((KAT[o.k] || {}).name || "")}${o.typ ? " · " + esc(o.typ) : ""}${o.r ? " · " + esc(o.r) : ""}</div></div>${o.p || o.at ? `<button class="btn klein" data-k="${o.id}">Karte</button>` : ""}</div>`).join("") : `<span class="hilfe">Noch keine.</span>`}</div>`;
  el.onclick = e => { if (e.target.dataset.k) zeigeAufKarte(e.target.dataset.k); else if (e.target.closest("[data-o]")) detail(e.target.closest("[data-o]").dataset.o); };
};

/* ---- Mehr (schmale Ansicht) ---- */
RENDER.mehr = () => {
  const info = { fahndung: ["Fahndung", "Sterne, Heat, Hinweise löschen"], autos: ["Autos & Lager", "Verkaufen, Garagen, Werkzeuge"], hundert: ["100 %", "Checkliste mit Zählern"], codes: ["Codes", "Tresore, Türen, Passwörter"], cheats: ["Cheats", "Alle 61 mit Freischaltung"], trophaeen: ["Trophäen", "55 zum Abhaken"], tipps: ["Tipps & Glitches", "Verpassbares, Kniffe"], jagd: ["Jagd & Angeln", "Tiere, Regeln"], neu: ["Neu & Patches", "Was sich geändert hat"], optionen: ["Spielstand", "Speichern, Export, Quellen"] };
  $("#s-mehr").innerHTML = `<div class="kopf-zeile"><h1>Mehr</h1>${sprachSchalter()}</div><div class="mehr-grid" style="margin-top:14px">${MEHR_SEITEN.map(v => `<button data-g="${v}"><b>${info[v][0]}</b><small>${info[v][1]}</small></button>`).join("")}</div>`;
  $("#s-mehr").onclick = e => { const b = e.target.closest("[data-g]"); if (b) gehe(b.dataset.g); };
};

/* ---- Spielstand & Einstellungen ---- */
RENDER.optionen = () => {
  const el = $("#s-optionen");
  const exp = JSON.stringify({ app: "leonida-helper", version: 3, profil: P() });
  el.innerHTML = `<h1>Spielstand & Einstellungen</h1><p class="unter">Gespeichert nur in diesem Browser. Für ein anderes Gerät: exportieren und dort importieren.</p>
    <h2>Spielstände</h2>
    ${Object.entries(S.profile).map(([id, p]) => `<div class="eintrag"><input type="radio" name="prof" class="haken" style="border-radius:50%" data-p="${id}" ${id === S.aktiv ? "checked" : ""} aria-label="aktiv">
      <div class="txt"><div class="titel">${esc(p.name)}</div><div class="ort">${Object.keys(p.done).length} Haken · ${Object.keys(p.zahlen || {}).length} Zähler · ${(p.eigen || []).length} eigene Punkte</div></div>
      <button class="btn klein" data-ren="${id}">Umbenennen</button>${Object.keys(S.profile).length > 1 ? `<button class="btn klein" data-del="${id}">Löschen</button>` : ""}</div>`).join("")}
    <div class="aktionen"><button class="btn" data-neu="1">Neuer Spielstand</button><button class="btn" data-reset="1">Haken im aktiven Spielstand zurücksetzen</button></div>
    <h2>Export / Import (aktiver Spielstand)</h2>
    <div class="karte-box">
      <textarea class="feld" id="o-exp" aria-label="Exportierter Spielstand" readonly>${esc(exp)}</textarea>
      <div class="aktionen"><button class="btn" data-cp="1">Kopieren</button></div>
      <textarea class="feld" id="o-imp" placeholder="Exportierten Text hier einfügen…" style="margin-top:12px"></textarea>
      <div class="aktionen"><button class="btn primaer" data-imp="1">Als neuen Spielstand importieren</button><label class="btn" style="display:inline-flex;align-items:center;justify-content:center">Datei wählen<input type="file" id="o-file" accept=".json,application/json,text/plain" hidden></label></div>
    </div>
    <h2>Sprache / Language</h2>
    <div class="karte-box" data-noi18n="1">${sprachSchalter()}<p class="hilfe" style="margin-bottom:0">Deutsch oder Englisch – Inhalte und Oberfläche. Haken und Spielstände bleiben erhalten. / German or English – content and interface. Your checkmarks and saves are kept.</p></div>
    <h2>Anzeige</h2>
    <div class="karte-box">
      <label class="f-zeile"><span class="name">Story-Spoiler zeigen (Trophäen)</span><input type="checkbox" class="schalter" data-e="spoiler" ${S.einst.spoiler ? "checked" : ""}></label>
      <label class="f-zeile"><span class="name">Gebietsnamen auf der Karte</span><input type="checkbox" class="schalter" data-e="gebiete" ${S.einst.gebiete ? "checked" : ""}></label>
      <label class="f-zeile"><span class="name">gtadb-Orte auf der Karte</span><input type="checkbox" class="schalter" data-e="gtadb" ${S.einst.gtadb ? "checked" : ""}></label>
    </div>
    <h2>Über die Daten</h2>
    <div class="karte-box">
      <p style="margin-top:0">Datenstand ${esc(LH.STAND)} (Spiel erschienen am 19.11.2026). Jeder Eintrag zeigt, ob mehrere Quellen übereinstimmen. „Lage ungefähr“ heißt: Gegend aus dem Guide, Punkt von Hand gesetzt – im Spiel genau hinsehen.</p>
      <p>Karte und Orte: <a href="https://map.gtadb.org" target="_blank" rel="noopener">map.gtadb.org</a> · Kacheln und Ortsdaten unter <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> (GTADB.ORG and contributors, <a href="https://github.com/rolux/gtadb.org" target="_blank" rel="noopener">GitHub</a>), für diese App in Pakete umgepackt. Karten-Bibliothek: Leaflet (BSD-2).</p>
      <p>Inhalte pflegen: alles steht in <code>data.js</code> (Anleitung oben in der Datei).</p>
      <p class="hilfe">Fan-Projekt, nicht von Rockstar Games. GTA VI ist eine Marke von Take-Two Interactive.</p>
      <h3 style="font-size:14px;margin:14px 0 6px">Quellen</h3>
      <ul style="margin:0;padding-left:18px">${Object.values(LH.QUELLEN).map(q => `<li><a href="${q.url}" target="_blank" rel="noopener">${esc(q.name)}</a></li>`).join("")}</ul>
    </div>`;
  el.onchange = async e => {
    const t = e.target;
    if (t.dataset.p) { S.aktiv = t.dataset.p; speichern(); allesNeu(); toast("Spielstand gewechselt"); RENDER.optionen(); }
    if (t.dataset.e) { S.einst[t.dataset.e] = t.checked; speichern(); markerAktualisieren(); gebieteAktualisieren(); gtadbAktualisieren(); }
    if (t.id === "o-file" && t.files[0]) { const txt = await t.files[0].text(); importieren(txt); }
  };
  el.onclick = async e => {
    const t = e.target;
    if (t.dataset.neu) { const r = await dialog({ titel: "Neuer Spielstand", felder: [{ ph: "Name, z. B. Cheat-Save" }], ok: "Anlegen" }); if (r && r[0].trim()) { const id = "p" + Date.now().toString(36); S.profile[id] = { name: r[0].trim(), done: {}, eigen: [], mv: 2 }; S.aktiv = id; speichern(); allesNeu(); RENDER.optionen(); } }
    if (t.dataset.ren) { const p = S.profile[t.dataset.ren]; const r = await dialog({ titel: "Umbenennen", felder: [{ wert: p.name }], ok: "Speichern" }); if (r && r[0].trim()) { p.name = r[0].trim(); speichern(); RENDER.optionen(); } }
    if (t.dataset.del) { const p = S.profile[t.dataset.del]; if (await dialog({ titel: "Spielstand löschen?", html: `<p>„${esc(p.name)}“ mit allen Haken und eigenen Punkten wird gelöscht.</p>`, ok: "Löschen", gefahr: true })) { delete S.profile[t.dataset.del]; if (!S.profile[S.aktiv]) S.aktiv = Object.keys(S.profile)[0]; speichern(); allesNeu(); RENDER.optionen(); } }
    if (t.dataset.reset) { if (await dialog({ titel: "Haken zurücksetzen?", html: `<p>Alle Haken in „${esc(P().name)}“ werden entfernt. Eigene Punkte bleiben.</p>`, ok: "Zurücksetzen", gefahr: true })) { P().done = {}; speichern(); allesNeu(); RENDER.optionen(); } }
    if (t.dataset.cp) kopieren($("#o-exp").value);
    if (t.dataset.imp) importieren($("#o-imp").value);
  };
};
function importieren(txt) {
  try {
    const j = JSON.parse(txt); const p = j.profil || j;
    if (!p || typeof p.done !== "object") throw new Error("kein Spielstand");
    const id = "p" + Date.now().toString(36);
    S.profile[id] = migriere({ name: (p.name || "Import") + " (Import)", done: p.done, eigen: Array.isArray(p.eigen) ? p.eigen : [], zahlen: p.zahlen || {}, mv: p.mv || 1 });
    S.aktiv = id; speichern(); allesNeu(); RENDER.optionen(); toast("Importiert und aktiviert");
  } catch (e) { toast("Import fehlgeschlagen: Text ist kein gültiger Export"); }
}

/* ================================================================= START */
oberflaecheStarten();
navBauen();
$("#logo-sprache").innerHTML = sprachSchalter();
$("#k-lang").textContent = LANG === "en" ? "🇬🇧" : "🇩🇪";
$("#k-lang").onclick = () => setzeSprache(LANG === "en" ? "de" : "en");
zeige(location.hash.slice(1) || "karte");
</script>
